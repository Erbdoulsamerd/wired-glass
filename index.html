<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Wired Glass</title>
  <meta name="description" content="Pebbled wired glass in Three.js. Drag to tilt the pane, watch the rain, move to catch the light, drop in your own image.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fragment+Mono&family=Instrument+Serif:ital@0;1&display=swap">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <canvas id="gl" tabindex="0" aria-label="Pane of wired, pebbled glass. Drag to tilt it, move the pointer to move the light, arrow keys also tilt and R resets."></canvas>
  <div class="fallback" id="fallback" hidden>This effect needs WebGL, which is turned off in this browser.</div>

  <div class="drop" id="drop" hidden><span>Drop your image on the glass</span></div>

  <div class="strip">
    <div class="name">
      <h1>Wired <i>Glass</i></h1>
      <span>drag to tilt · move to catch the light</span>
    </div>
    <div class="controls">
      <label for="depth">Depth <input id="depth" type="range" min="0" max="1" step="0.01" value="0.65"></label>
      <label for="frost">Frost <input id="frost" type="range" min="0" max="1" step="0.01" value="0.6"></label>
      <label for="mesh"><input id="mesh" type="checkbox" checked> Wire</label>
      <label for="sway"><input id="sway" type="checkbox" checked> Sway</label>
      <label for="rain"><input id="rain" type="checkbox" checked> Rain</label>
      <label for="rainSpeed">Rain speed <input id="rainSpeed" type="range" min="0.1" max="3" step="0.05" value="1"></label>
      <label for="garden">Garden <select id="garden"></select></label>
      <button id="upload" type="button">Use my image</button>
      <button id="reseed" type="button">New garden</button>
      <button id="reset" type="button">Reset tilt</button>
      <input id="file" type="file" accept="image/*" hidden>
    </div>
  </div>

  <div class="player" role="group" aria-label="Lofi rain player">
    <button id="play" type="button" class="play" aria-pressed="false" aria-label="Play lofi rain">
      <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path id="playIcon" d="M4 2.5v11l9-5.5z" fill="currentColor"/></svg>
    </button>
    <div class="track">
      <span id="trackName">Wire &amp; Window</span>
      <small id="trackMeta">lofi + rain · 1 / 4</small>
    </div>
    <button id="next" type="button" class="icon" aria-label="Next track">
      <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M3 3v10l7-5zM11 3h2v10h-2z" fill="currentColor"/></svg>
    </button>
    <label for="vol" class="vol"><span class="sr">Volume</span><input id="vol" type="range" min="0" max="1" step="0.01" value="0.7"></label>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
  </script>
  <script type="module" src="./main.js"></script>
</body>
</html>
